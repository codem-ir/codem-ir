name: Update News

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add news
        run: |
          echo '[{"title":"خبر جدید کالاف دیوتی موبایل","category":"آپدیت و Season","text":"خبر خودکار جدید اضافه شد","date":"2026-08-25"}]' > news.json

      - name: Save changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add news.json
          git commit -m "Auto update news" || exit 0
          git push
